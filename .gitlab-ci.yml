stages:
  - build
  - test
  - deploy

variables:
  JAVA_HOME: "/usr/lib/jvm/java-21-openjdk"
  PATH: "$JAVA_HOME/bin:$PATH"

before_script:
  - export GRADLE_USER_HOME=$(pwd)/.gradle

build_java_ui:
  stage: build
  image:
    name: gradle:8.3-jdk20
    entrypoint: [""]
  script:
    - cd java-ui
    - echo "Cleaning and building JavaFX project..."
    - gradle --no-daemon clean build
    - echo "Build complete. Checking JAR existence..."
    - test -f build/libs/java-ui-1.0.jar || (echo "JAR not found!" && exit 1)
  artifacts:
    paths:
      - java-ui/build/libs/java-ui-1.0.jar
    expire_in: 1 hour
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/

test_jar_launch:
  stage: test
  image: eclipse-temurin:21
  dependencies:
    - build_java_ui
  script:
    - echo "Checking for built JAR..."
    - test -f java-ui/build/libs/java-ui-1.0.jar || (echo 'JAR missing!' && exit 1)
    - echo "Launching the JAR in headless mode..."
    - java -jar java-ui/build/libs/java-ui-1.0.jar --headless &
    - JAR_PID=$!
    - sleep 5
    - if ps -p $JAR_PID > /dev/null; then
          echo "JAR launched successfully. Killing process...";
          kill $JAR_PID;
      else
          echo "JAR did not start properly.";
          exit 1;
      fi

deploy_to_interface:
  stage: deploy
  image: alpine:latest
  dependencies:
    - test_jar_launch
  script:
    - echo "Deploying built JAR to bash-app/modules/interface/"
    - mkdir -p bash-app/modules/interface
    - cp java-ui/build/libs/java-ui-1.0.jar bash-app/modules/interface/
    - ls -lh bash-app/modules/interface/
  artifacts:
    paths:
      - bash-app/modules/interface/java-ui-1.0.jar
    expire_in: 1 week
