stages:
  - build
  - test
  - package

# --- STAGE BUILD : Compilation de l'interface graphique ---
build_java:
  stage: build
  image: maven:3.8.4-openjdk-17
  script:
    - cd java-ui
    - chmod +x buildApp.sh deployApp.sh
    - ./buildApp.sh
    - ./deployApp.sh
  artifacts:
    paths:
      - bash-app/modules/graphicInterface/runtime/
      - bash-app/modules/graphicInterface/*.jar
    expire_in: 1 hour

# --- STAGE TEST : Validation de tous les modules ---
test_cyberdiag:
  stage: test
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y jq bash iproute2 curl
  script:
    - chmod +x scripts/*.sh
    - ./scripts/set_right.sh
    - cd bash-app
    - chmod +x main.sh
    - ./main.sh --test

# --- STAGE PACKAGE : Génération du fichier .deb ---
package_debian:
  stage: package
  image: ubuntu:22.04
  dependencies:
    - build_java
  script:
    - apt-get update && apt-get install -y binutils
    - chmod +x scripts/*.sh
    - ./scripts/set_right.sh
    - ./scripts/build_deb.sh
  artifacts:
    name: "cyberdiag-package"
    paths:
      - "*.deb"
    expire_in: 1 week
  only:
    - main
    - dev