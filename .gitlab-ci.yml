stages:
  - build
  - test
  - deploy
  - verify

variables:
  # Définir le module pour les commandes JLink
  APP_MODULE: edu.cyclonicforce.fr.java.ui
  # Définir la classe principale pour les commandes JLink
  APP_MAIN: edu.cyclonicforce.fr.ui.Main
  # Définir le chemin de l'image d'exécution générée par JLink (dossier)
  JLINK_IMAGE_DIR: java-ui/target/java-ui-linux
  # Nom du lanceur générique dans l'image JLink sur Linux
  JLINK_LAUNCHER: java-ui/target/java-ui-linux/bin/java

# ---------- BUILD (Maven + JLink pour Linux) ----------
build_maven_jlink:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    # 1. On ne fait PAS de 'cd java-ui'. On reste à la racine.
    - echo "Running Maven build from root..."
    
    # 2. On utilise l'option '-f' pour indiquer le fichier pom.xml
    # On exécute seulement 'package'. Le profil 'linux-jlink' lié à la phase package 
    # s'occupera de lancer jlink avec le bon nom (java-ui-linux).
    - mvn -f java-ui/pom.xml clean package
    
    # 3. Debug : Listons le contenu de target pour être sûr du nom du dossier
    - echo "Contenu de target :"
    - ls -l java-ui/target/
    
    # 4. Vérification finale avec la variable
    - ls -l ${JLINK_IMAGE_DIR}
  artifacts:
    paths:
      - ${JLINK_IMAGE_DIR}
    expire_in: 1 hour

# ---------- TEST (Lancement de l'image JLink) ----------
test_jlink_launch:
  stage: test
  image: eclipse-temurin:17-jdk
  dependencies:
    - build_maven_jlink
  script:
    # 1. Installation de Xvfb et des libs graphiques
    # xvfb : Crée l'écran virtuel
    # libgtk-3-0 / libx11-6 : Nécessaires pour le moteur JavaFX Linux
    - apt-get update && apt-get install -y xvfb libx11-6 libxext6 libxrender1 libxtst6 libxi6 libgtk-3-0

    - echo "Checking JLink image directory..."
    - test -d ${JLINK_IMAGE_DIR} || (echo "JLink image not found!" && exit 1)

    - echo "Launching JLink image with Xvfb (Virtual Display)..."
    
    # 2. Lancement avec xvfb-run
    # -a : Trouve un numéro d'écran libre automatiquement
    # -Dprism.order=sw : Force le rendu logiciel (pas de GPU dans la CI)
    # On a RETIRÉ -Dglass.platform=Monocle
    - xvfb-run -a ${JLINK_LAUNCHER} -Dprism.order=sw --module ${APP_MODULE}/${APP_MAIN} &

    - APP_PID=$!
    - sleep 5
    
    # Vérification
    - |
      if ps -p $APP_PID > /dev/null; then
        echo "✅ Application started successfully inside Xvfb.";
        kill $APP_PID;
      else
        echo "❌ Application failed to start.";
        exit 1;
      fi
  artifacts:
    paths:
      - ${JLINK_IMAGE_DIR}
    expire_in: 1 hour

# ---------- DEPLOY (Copie de l'image JLink vers Git) ----------
deploy_to_interface:
  stage: deploy
  image: alpine/git:latest # Image légère avec Git pour la manipulation du dépôt
  dependencies:
    - test_jlink_launch
  script:
    - echo "Configuring Git for CI push..."
    - git config --global user.email "ci-bot@gitlab.local"
    - git config --global user.name "GitLab CI Bot"

    # 1. PRÉPARATION DU DÉPÔT LOCAL (Assurez-vous d'être sur la bonne branche)
    - git fetch origin dev
    - git reset --hard
    - git clean -fd
    - git checkout dev
    - git pull origin dev --rebase

    # 2. COPIE DE L'IMAGE JLINK
    - echo "Deploying JLink image to bash-app/modules/graphicInterface/runtime/"
    - ARTIFACT_SOURCE=${CI_PROJECT_DIR}/java-ui/target/java-ui-linux # Chemin d'entrée
    - ARTIFACT_DEST=bash-app/modules/graphicInterface/runtime # Chemin de sortie

    # Suppression de l'ancienne image runtime et copie de la nouvelle
    - rm -rf ${ARTIFACT_DEST}
    - mkdir -p ${ARTIFACT_DEST}
    # Utilisation de cp -r pour copier le dossier runtime complet
    - cp -r ${ARTIFACT_SOURCE} ${ARTIFACT_DEST}/

    - ls -lh ${ARTIFACT_DEST}

    # 3. COMMIT ET PUSH
    # Ajoutez le répertoire complet de l'image d'exécution
    - git add ${ARTIFACT_DEST}
    - 'git commit -m "CI: update JLink runtime image for graphicInterface [skip ci]" || echo "No changes to commit"'
    - git push origin dev

# ---------- VERIFY (MERGE CHECK) ----------
check_merge:
  stage: verify
  image: alpine:latest
  script:
    - apk add --no-cache git
    - echo "Cloning fresh copy of dev branch..."
    - git clone --branch dev https://gitlab-ci-token:$CI_JOB_TOKEN@forgens.univ-ubs.fr/gitlab/but2info/cyberdiag_b.git repo-check
    - cd repo-check
    - echo "Checking if JLink runtime image exists in graphicInterface module..."
    # La vérification doit cibler un fichier clé dans l'image runtime, comme l'exécutable
    - test -f bash-app/modules/graphicInterface/runtime/java-ui-linux/bin/java || (echo "❌ JLink image missing — merge forbidden!" && exit 1)
    - echo "✅ JLink image found — safe to merge."
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'