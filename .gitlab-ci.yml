stages:
  - build
  - test
  - deploy
  - verify

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

before_script:
  - echo "Using Gradle wrapper and JDK from eclipse-temurin image"

build_gradle_project:
  stage: build
  image: eclipse-temurin:latest
  script:
    - cd java-ui
    - echo "Running Gradle build..."
    - chmod +x ./gradlew
    - ./gradlew clean build
  artifacts:
    paths:
      - java-ui/build/libs/java-ui-1.0.jar
    expire_in: 1 hour

test_jar_launch:
  stage: test
  image: eclipse-temurin:latest
  dependencies:
    - build_gradle_project
  script:
    - echo "Checking built JAR..."
    - test -f java-ui/build/libs/java-ui-1.0.jar || (echo "JAR not found!" && exit 1)
    - echo "Launching JAR in headless mode..."
    - java -jar java-ui/build/libs/java-ui-1.0.jar --headless &
    - JAR_PID=$!
    - sleep 5
    - if ps -p $JAR_PID > /dev/null; then
          echo "JAR started successfully.";
          kill $JAR_PID;
      else
          echo "JAR failed to start.";
          exit 1;
      fi

deploy_to_interface:
  stage: deploy
  image: alpine/git
  dependencies:
    - build_gradle_project
  script:
    - echo "Deploying built JAR to bash-app/modules/interface/"
    - mkdir -p bash-app/modules/interface
    - cp java-ui/build/libs/java-ui-1.0.jar bash-app/modules/interface/
    - git config --global user.email "ci-bot@forge.ubs.fr"
    - git config --global user.name "GitLab CI Bot"
    - git fetch origin dev
    - git checkout dev
    - git add bash-app/modules/interface/java-ui-1.0.jar
    - git commit -m "Auto-deploy: update JAR via pipeline $CI_PIPELINE_ID" || echo "No changes to commit"
    - git push https://oauth2:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git dev
  only:
    - dev
  artifacts:
    paths:
      - bash-app/modules/interface/java-ui-1.0.jar
    expire_in: 1 week

check_deploy:
  stage: verify
  image: alpine:latest
  script:
    - echo "Verifying that the JAR exists..."
    - test -f bash-app/modules/interface/java-ui-1.0.jar || (echo "JAR missing! Merge blocked." && exit 1)
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
